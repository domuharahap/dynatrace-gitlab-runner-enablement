# kkm-pulse-demo — reference pipeline for the GitLab CI + Dynatrace workshop.
# Built up incrementally across usecase2-nodejs-sast.md through
# usecase5-devprodstages.md. Runs entirely on a `shell`-tagged GitLab Runner
# registered inside the workshop Codespace (see usecase1-gitlabrunner.md) —
# no docker/kubernetes executor or external registry required.

stages:
  - build
  - test
  - code_quality
  - package
  - deploy_dev
  - load_test
  - deploy_prod

include:
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  # The bundled SAST analyzers ship as Docker images. Our runner uses the
  # shell executor (no container isolation) so it can't run them here — in
  # a production setup you'd point a docker/kubernetes-executor runner at
  # this pipeline instead. We keep the include for visibility but disable
  # actual scanning to avoid stuck/failing jobs on this runner.
  SAST_DISABLED: "true"

# ---------------------------------------------------------------------------
# build / test — usecase2-nodejs-sast.md
# ---------------------------------------------------------------------------
build-job:
  stage: build
  tags:
    - shell
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

test-job:
  stage: test
  tags:
    - shell
  needs:
    - build-job
  script:
    - npm test

# ---------------------------------------------------------------------------
# code_quality — usecase2-nodejs-sast.md
# ---------------------------------------------------------------------------
.sonarqube-check:
  stage: code_quality
  tags:
    - shell
  variables:
    GIT_DEPTH: "0"  # SonarQube wants full git history for blame/new-code analysis
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  cache:
    key: "sonar-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=kkm-pulse-demo
      -Dsonar.sources=.
      -Dsonar.host.url="${SONAR_HOST_URL}"
      -Dsonar.token="${SONAR_TOKEN}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'

# ---------------------------------------------------------------------------
# package — usecase3-deployk8s.md
# ---------------------------------------------------------------------------
.docker-build:
  stage: package
  tags:
    - shell
  needs:
    - test-job
  script:
    - docker build -t kkm-pulse-demo:${CI_COMMIT_SHORT_SHA} .
    - k3d image import kkm-pulse-demo:${CI_COMMIT_SHORT_SHA} -c enablement

# ---------------------------------------------------------------------------
# deploy_dev — usecase3-deployk8s.md, usecase4-dynatrace.md
# ---------------------------------------------------------------------------
.deploy-dev:
  stage: deploy_dev
  tags:
    - shell
  needs:
    - docker-build
  environment:
    name: development
    url: http://kkm-pulse-dev.127.0.0.1.sslip.io
  script:
    - kubectl create namespace kkm-pulse-dev --dry-run=client -o yaml | kubectl apply -f -
    - sed -e "s#__NAMESPACE__#kkm-pulse-dev#" -e "s#__IMAGE__#kkm-pulse-demo:${CI_COMMIT_SHORT_SHA}#" manifests/deployment.yaml | kubectl apply -f -
    - kubectl apply -f manifests/ingress-dev.yaml
    - kubectl rollout status deployment/kkm-pulse-demo -n kkm-pulse-dev --timeout=120s
    - 'curl -sf -H "Host: kkm-pulse-dev.127.0.0.1.sslip.io" http://localhost/api/status'

.notify-dynatrace-deploy:
  stage: deploy_dev
  tags:
    - shell
  needs:
    - deploy-dev
  script:
    - DT_TENANT=$(echo "$DT_ENVIRONMENT" | sed -E 's/\.apps\./.live./; s#/$##')
    - >
      curl -sf -X POST "${DT_TENANT}/api/v2/events/ingest"
      -H "Authorization: Api-Token ${DT_INGEST_TOKEN}"
      -H "Content-Type: application/json"
      -d "{\"eventType\":\"CUSTOM_DEPLOYMENT\",\"title\":\"kkm-pulse-demo deployed to dev\",\"properties\":{\"dt.event.deployment.name\":\"kkm-pulse-demo\",\"version\":\"${CI_COMMIT_SHORT_SHA}\",\"environment\":\"dev\"}}"

# ---------------------------------------------------------------------------
# load_test — usecase4-dynatrace.md
# ---------------------------------------------------------------------------
load-test:
  stage: load_test
  tags:
    - shell
  needs:
    - notify-dynatrace-deploy
  script:
    - |
      TARGET="http://localhost/api/status"
      HOST_HEADER="kkm-pulse-dev.127.0.0.1.sslip.io"
      TOTAL=50
      FAIL=0
      SUM_MS=0
      for i in $(seq 1 $TOTAL); do
        RESULT=$(curl -s -o /dev/null -H "Host: ${HOST_HEADER}" -w "%{http_code} %{time_total}" "$TARGET")
        CODE=$(echo "$RESULT" | awk '{print $1}')
        SECS=$(echo "$RESULT" | awk '{print $2}')
        MS=$(awk -v s="$SECS" 'BEGIN{printf "%d", s*1000}')
        SUM_MS=$((SUM_MS + MS))
        [ "$CODE" != "200" ] && FAIL=$((FAIL + 1))
      done
      AVG_MS=$((SUM_MS / TOTAL))
      ERROR_RATE=$((FAIL * 100 / TOTAL))
      echo "Requests: $TOTAL  Failures: $FAIL  Error rate: ${ERROR_RATE}%  Avg latency: ${AVG_MS}ms"
      {
        echo "LOADTEST_TOTAL=$TOTAL"
        echo "LOADTEST_FAIL=$FAIL"
        echo "LOADTEST_ERROR_RATE=$ERROR_RATE"
        echo "LOADTEST_AVG_MS=$AVG_MS"
      } >> loadtest.env
  artifacts:
    reports:
      dotenv: loadtest.env

.notify-dynatrace-test-result:
  stage: load_test
  tags:
    - shell
  needs:
    - load-test
  script:
    - DT_TENANT=$(echo "$DT_ENVIRONMENT" | sed -E 's/\.apps\./.live./; s#/$##')
    - >
      curl -sf -X POST "${DT_TENANT}/api/v2/events/ingest"
      -H "Authorization: Api-Token ${DT_INGEST_TOKEN}"
      -H "Content-Type: application/json"
      -d "{\"eventType\":\"CUSTOM_INFO\",\"title\":\"kkm-pulse-demo load test result\",\"properties\":{\"requests\":\"${LOADTEST_TOTAL}\",\"failures\":\"${LOADTEST_FAIL}\",\"error_rate_pct\":\"${LOADTEST_ERROR_RATE}\",\"avg_latency_ms\":\"${LOADTEST_AVG_MS}\",\"commit\":\"${CI_COMMIT_SHORT_SHA}\"}}"
    - |
      if [ "$LOADTEST_ERROR_RATE" -gt 10 ]; then
        echo "Error rate ${LOADTEST_ERROR_RATE}% exceeds the 10% budget — failing this job."
        exit 1
      fi

# ---------------------------------------------------------------------------
# deploy_prod — usecase5-devprodstages.md
# Gated: only offered once notify-dynatrace-test-result has succeeded, and
# even then requires a human to click "run" (when: manual).
# ---------------------------------------------------------------------------
.deploy-prod:
  stage: deploy_prod
  tags:
    - shell
  needs:
    - notify-dynatrace-test-result
  when: manual
  environment:
    name: production
    url: http://kkm-pulse-prod.127.0.0.1.sslip.io
  script:
    - kubectl create namespace kkm-pulse-prod --dry-run=client -o yaml | kubectl apply -f -
    - sed -e "s#__NAMESPACE__#kkm-pulse-prod#" -e "s#__IMAGE__#kkm-pulse-demo:${CI_COMMIT_SHORT_SHA}#" manifests/deployment.yaml | kubectl apply -f -
    - kubectl apply -f manifests/ingress-prod.yaml
    - kubectl rollout status deployment/kkm-pulse-demo -n kkm-pulse-prod --timeout=120s
    - 'curl -sf -H "Host: kkm-pulse-prod.127.0.0.1.sslip.io" http://localhost/api/status'

.notify-dynatrace-prod-deploy:
  stage: deploy_prod
  tags:
    - shell
  needs:
    - deploy-prod
  script:
    - DT_TENANT=$(echo "$DT_ENVIRONMENT" | sed -E 's/\.apps\./.live./; s#/$##')
    - >
      curl -sf -X POST "${DT_TENANT}/api/v2/events/ingest"
      -H "Authorization: Api-Token ${DT_INGEST_TOKEN}"
      -H "Content-Type: application/json"
      -d "{\"eventType\":\"CUSTOM_DEPLOYMENT\",\"title\":\"kkm-pulse-demo deployed to PRODUCTION\",\"properties\":{\"dt.event.deployment.name\":\"kkm-pulse-demo\",\"version\":\"${CI_COMMIT_SHORT_SHA}\",\"environment\":\"prod\"}}"
