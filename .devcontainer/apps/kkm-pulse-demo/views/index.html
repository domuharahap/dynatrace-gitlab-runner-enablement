<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKM x Dynatrace | Health Tech Pulse</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; color: #333; margin: 0; padding: 40px; text-align: center; }
        .card { background: white; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #006643; margin-bottom: 10px; }
        .tagline { font-size: 1.1em; color: #555; margin-bottom: 30px; }
        .metric-box { background: #e6f4ea; border-left: 5px solid #34a853; padding: 15px; margin: 15px 0; text-align: left; border-radius: 4px; }
        button { background: #ff6f00; color: white; border: none; padding: 12px 20px; font-size: 1em; border-radius: 6px; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        button:hover { background: #e06200; }
        .footer { margin-top: 30px; font-size: 0.85em; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Kementerian Kesihatan Malaysia</h1>
        <div class="tagline"><i>Smart Hospital Operations & Observability Portal</i></div>
        
        <div class="metric-box" id="data-container">
            <p><strong>System Status:</strong> Loading vitals...</p>
            <p><strong>Active Queue:</strong> --</p>
            <p><strong>Est. Wait Time:</strong> --</p>
        </div>

        <button onclick="triggerAnomaly()">Simulate Traffic Spike (Test Davis AI)</button>
        <p id="response-msg" style="font-size: 0.9em; color: #006643; margin-top: 10px;"></p>

        <div class="footer">
            Powered by Node.js &amp; Observed via <b>Dynatrace OneAgent</b> 🛡️
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('data-container').innerHTML = `
                    <p><strong>Location:</strong> ${data.hospital}</p>
                    <p><strong>System Status:</strong> ${data.status}</p>
                    <p><strong>Active Patients in Queue:</strong> ${data.activePatients}</p>
                    <p><strong>Average Wait Time:</strong> ${data.averageWaitTimeMinutes} minutes</p>
                    <p><strong>Staff Vibe:</strong> ${data.staffMood}</p>
                `;
            } catch (e) {
                console.error(e);
            }
        }

        async function triggerAnomaly() {
            const msg = document.getElementById('response-msg');
            msg.innerText = "Injecting load into the cluster...";
            const res = await fetch('/api/trigger-anomaly');
            const data = await res.json();
            msg.innerText = data.message;
        }

        fetchStatus();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
